[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskingai-common"
version = "0.1.0"
description = "Common shared modules across TaskingAI micro-services"
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["common*"]
