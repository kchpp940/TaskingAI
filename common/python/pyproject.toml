[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "taskingai-common"
version = "0.1.12"
description = "TaskingAI common utilities and helpers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "TaskingAI"}]
keywords = ["taskingai", "common", "utils", "tkhelper"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "redis>=5.0.0",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "boto3>=1.28.0",
]

[project.urls]
"Homepage" = "https://github.com/TaskingAI/TaskingAI"
"Bug Tracker" = "https://github.com/TaskingAI/TaskingAI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["tkhelper*"]
