[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskingai-contracts"
version = "1.0.0"
description = "Shared contracts and schemas for TaskingAI services (plugin, backend, frontend)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "TaskingAI" }]
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "jsonschema>=4.19,<5.0",
    "pydantic>=2.0,<3.0",
]

[tool.setuptools.packages.find]
include = ["taskingai_contracts*"]

[tool.setuptools.package-data]
taskingai_contracts = ["artifact/schemas/*.json"]
