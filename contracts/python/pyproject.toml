[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taskingai-contracts"
version = "1.0.0"
description = "Shared contracts and schemas for TaskingAI services (plugin, backend, frontend)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TaskingAI" },
]
dependencies = [
    "jsonschema>=4.19,<5.0",
    "pydantic>=2.0,<3.0",
]

[project.urls]
Homepage = "https://github.com/TaskingAI/TaskingAI"

[tool.setuptools]
packages = ["taskingai_contracts", "taskingai_contracts.artifact"]

[tool.setuptools.package-data]
"taskingai_contracts.artifact" = ["schemas/*.json"]
